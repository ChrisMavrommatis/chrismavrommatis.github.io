<!DOCTYPE html>
<html lang="{{ page.hreflang }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% include seo.html %}

    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Karla:wght@400..800&display=swap" rel="stylesheet" />

    <link href="/assets/css/main.css" rel="stylesheet" />
    <link href="/assets/css/pygments.css" rel="stylesheet" />
    {% gtm_head site.gtm %}
  </head>

  <body class="layout-{{ page.layout | default: 'page' }}">
    {% gtm_body site.gtm %}

    {{ content }}
  </body>
</html>
