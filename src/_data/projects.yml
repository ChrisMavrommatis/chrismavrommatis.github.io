# Only `listed: true` shows on the site.
#
# `stack` - the few technologies worth naming, most prominent first. Display only,
#           nothing links them. Platform and language first, then whatever makes the
#           project specific, minus anything the description already says.
#
# `description` is a predicate. It renders straight after the bolded name, so it has
# to read on from it: "Binacle.Net answers whether...".

- slug: binacle-net
  name: Binacle.Net
  description: is an API for the 3D bin packing problem. It answers whether a set of items fits in a bin, and where each one goes.
  url: https://github.com/binacle-labs/Binacle.Net
  stack: [dotnet, csharp, aspnet-core, docker]
  listed: true

