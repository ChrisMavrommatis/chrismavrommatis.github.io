name: Chris Mavrommatis
occupation: Software engineer, .NET and security
headline: >-
  I build software in .NET, and a lot of my own time goes on
  <em>how it gets attacked</em>.
intro: >-
  Mostly C# on the back end, APIs and the code underneath them. When something
  surprises me I go and find out why, then I write down what I found, the failed
  attempts included. That is most of what is here.

answers:
  built: >-
    Hobby projects, mostly. Each one started because I wanted to find out how
    something worked, and I hope a couple of them are of some use to someone else.
  built_more: >-
    There are a few smaller ones on
    <a href="https://github.com/ChrisMavrommatis/">GitHub</a>.
  written: >-
    Two things, mostly. Security, for people who do not work in security. And
    whatever I have just taken apart, benchmarks, allocation counts, and the times
    I was measuring the wrong thing.
  know_lead: Day to day I work with these.
  know_tail: >-
    The rest came from work, or from breaking my own things. Some of it I sat an
    exam for, and that is the only part with a date on it.
  everything: >-
    No. There is more I have not written up, and a couple of things I got wrong
    that I ought to go back to. A subject for a later date.
  index: >-
    Security for people who do not spend their day on it, and whatever I have just
    gone and measured.

signoff:
  line: That's it for now…
  farewell: Take care and stay safe…

