# Icon files land in the site root and under assets/. seo.html renders these.
icons:
  - rel: 'icon'
    href: '/favicon.ico'
    sizes: 'any'
  - rel: 'icon'
    type: 'image/png'
    sizes: '32x32'
    href: '/assets/favicon-32x32.png'
  - rel: 'icon'
    type: 'image/png'
    sizes: '16x16'
    href: '/assets/favicon-16x16.png'
  - rel: 'apple-touch-icon'
    sizes: '180x180'
    href: '/assets/apple-touch-icon.png'
  - rel: 'manifest'
    href: '/site.webmanifest'
