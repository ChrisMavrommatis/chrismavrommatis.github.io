{%- assign ui = site.data.ui -%}
<button class="theme-toggle" type="button" data-theme-toggle aria-label="{{ ui.theme.toggle | required: 'ui.theme.toggle' }}">
  <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z" />
  </svg>
  <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
  </svg>
  <span>{{ ui.theme.label | required: 'ui.theme.label' }}</span>
</button>

<script>
  (function () {
    var root = document.documentElement;
    var btn = document.querySelector('[data-theme-toggle]');
    if (!btn) return;

    var media = window.matchMedia('(prefers-color-scheme: dark)');

    function effective() {
      var set = root.getAttribute('data-theme');
      if (set === 'light' || set === 'dark') return set;
      return media.matches ? 'dark' : 'light';
    }

    function relabel() {
      var next = effective() === 'dark' ? 'light' : 'dark';
      btn.setAttribute('aria-label', 'Switch to the ' + next + ' theme');
      btn.setAttribute('title', 'Switch to the ' + next + ' theme');
    }

    btn.addEventListener('click', function () {
      var next = effective() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
      relabel();
    });

    // Only follows the OS while no choice has been stored.
    media.addEventListener('change', function () {
      if (!root.getAttribute('data-theme')) relabel();
    });

    relabel();
  })();
</script>
